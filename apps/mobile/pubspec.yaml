name: sharkord_mobile
description: "Discord-alternative mobile client for Sharkord Plus in Flutter & Rust."
publish_to: 'none'
version: 0.2.4+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  open_filex: ^4.5.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_webrtc: ^0.11.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
