name: Rust Core & GPUI Desktop CI

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
    paths:
      - 'crates/**'
      - 'apps/desktop-gpui/**'
      - 'apps/mobile/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'crates/**'
      - 'apps/desktop-gpui/**'
      - 'apps/mobile/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Test & Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev patchelf file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all Rust tests
        run: cargo test --all

      - name: Build release binaries
        run: cargo build --release -p desktop-gpui -p sharkord-core

      - name: Package desktop application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-windows
          cp target/release/desktop-gpui.exe dist-windows/sharkord-gpui-windows-x64.exe
          (cd dist-windows && (zip sharkord-gpui-windows-x64.zip sharkord-gpui-windows-x64.exe || tar -a -cf sharkord-gpui-windows-x64.zip sharkord-gpui-windows-x64.exe))
          cargo packager --release -p desktop-gpui --formats wix || cargo packager --release --config apps/desktop-gpui/packager.toml --formats wix || (cd apps/desktop-gpui && cargo packager --release --formats wix) || true
          find . -type f \( -name "*.msi" -o -name "*.exe" \) ! -path "*/node_modules/*" ! -path "*/debug/*" ! -path "*/build/*" ! -path "*/deps/*" ! -path "*/incremental/*" ! -path "*/target/release/desktop-gpui.exe" ! -path "./dist-windows/*" ! -path "./.git/*" -exec cp {} dist-windows/ \; || true
          ls -la dist-windows

      - name: Package desktop application (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-linux
          cp target/release/desktop-gpui dist-linux/sharkord-gpui-linux-x64
          chmod +x dist-linux/sharkord-gpui-linux-x64
          (cd dist-linux && tar -czvf sharkord-gpui-linux-x64.tar.gz sharkord-gpui-linux-x64)
          cargo packager --release -p desktop-gpui --formats appimage,deb || cargo packager --release --config apps/desktop-gpui/packager.toml --formats appimage,deb || (cd apps/desktop-gpui && cargo packager --release --formats appimage,deb) || true
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) ! -path "*/node_modules/*" ! -path "*/debug/*" ! -path "./dist-linux/*" ! -path "./.git/*" -exec cp {} dist-linux/ \; || true
          ls -la dist-linux

      - name: Upload desktop artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-windows
          path: dist-windows/*
          if-no-files-found: warn

      - name: Upload desktop artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-linux
          path: dist-linux/*
          if-no-files-found: warn

  build-macos:
    name: Build (macos-latest)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release binaries
        run: cargo build --release -p desktop-gpui -p sharkord-core

      - name: Package desktop application (macOS)
        run: |
          DIST_MACOS="$(pwd)/dist-macos"
          mkdir -p "$DIST_MACOS"
          cp target/release/desktop-gpui "$DIST_MACOS/sharkord-gpui-macos-arm64"
          chmod +x "$DIST_MACOS/sharkord-gpui-macos-arm64"
          (cd "$DIST_MACOS" && zip sharkord-gpui-macos-arm64.zip sharkord-gpui-macos-arm64)
          cargo packager --release -p desktop-gpui --formats dmg,app || cargo packager --release --config apps/desktop-gpui/packager.toml --formats dmg,app || (cd apps/desktop-gpui && cargo packager --release --formats dmg,app) || true
          find . -type f -name "*.dmg" ! -path "*/node_modules/*" ! -path "*/debug/*" ! -path "./dist-macos/*" ! -path "./.git/*" -exec cp {} "$DIST_MACOS/" \; || true
          for app_path in $(find . -type d -name "*.app" ! -path "*/node_modules/*" ! -path "*/build/*" ! -path "*/target/debug/*"); do
            app_name=$(basename "$app_path" .app)
            if [ ! -f "$DIST_MACOS/${app_name}-macos.zip" ] && [ ! -f "$DIST_MACOS/${app_name}.zip" ]; then
              (cd "$(dirname "$app_path")" && zip -r "$DIST_MACOS/${app_name}-macos.zip" "$(basename "$app_path")")
            fi
          done
          ls -la "$DIST_MACOS"

      - name: Upload desktop artifacts (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-macos
          path: dist-macos/*
          if-no-files-found: warn

  build-mobile-android:
    name: Build Mobile (Android APK)
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Run Flutter tests
        run: |
          cd apps/mobile
          flutter pub get
          flutter test

      - name: Build release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Stage mobile artifacts
        run: |
          mkdir -p dist-mobile
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist-mobile/sharkord-mobile-android.apk
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist-mobile/sharkord-mobile-android-${{ github.ref_name }}.apk"
          fi
          ls -la dist-mobile

      - name: Upload mobile artifacts (Android)
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-mobile-android
          path: dist-mobile/*
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    needs: [check-and-test, build-macos, build-mobile-android]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate automated release notes
        run: node .github/scripts/generate-release-notes.js release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.apk" -o -name "*.ipa" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist-release/ \;
          find release-artifacts -type f \( -name "*linux*" -o -name "*macos*" \) ! -name "*.*" -exec cp {} dist-release/ \; 2>/dev/null || true
          find dist-release -type f \( -name "*.AppImage" -o -name "*-linux-*" -o -name "*-macos-*" \) -exec chmod +x {} \;
          echo "=== Contents of dist-release ==="
          ls -la dist-release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sharkord Plus ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: release-notes.md
          files: |
            dist-release/*
