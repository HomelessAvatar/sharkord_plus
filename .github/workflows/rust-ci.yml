name: Rust Core & GPUI Desktop CI

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
    paths:
      - 'crates/**'
      - 'apps/desktop-gpui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'crates/**'
      - 'apps/desktop-gpui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Test & Build (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all Rust tests
        run: cargo test --all

      - name: Build release binaries
        run: cargo build --release -p desktop-gpui -p sharkord-core

      - name: Upload desktop binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-windows
          path: target/release/desktop-gpui.exe

      - name: Upload desktop binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-linux
          path: target/release/desktop-gpui

      - name: Upload desktop binary (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-macos
          path: target/release/desktop-gpui

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: [check-and-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate automated release notes
        run: node .github/scripts/generate-release-notes.js release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          if [ -f release-artifacts/sharkord-gpui-windows/desktop-gpui.exe ]; then
            cp release-artifacts/sharkord-gpui-windows/desktop-gpui.exe dist-release/sharkord-gpui-windows-x64.exe
            (cd dist-release && zip sharkord-gpui-windows-x64.zip sharkord-gpui-windows-x64.exe)
          fi
          if [ -f release-artifacts/sharkord-gpui-linux/desktop-gpui ]; then
            cp release-artifacts/sharkord-gpui-linux/desktop-gpui dist-release/sharkord-gpui-linux-x64
            chmod +x dist-release/sharkord-gpui-linux-x64
            (cd dist-release && tar -czvf sharkord-gpui-linux-x64.tar.gz sharkord-gpui-linux-x64)
          fi
          if [ -f release-artifacts/sharkord-gpui-macos/desktop-gpui ]; then
            cp release-artifacts/sharkord-gpui-macos/desktop-gpui dist-release/sharkord-gpui-macos-arm64
            chmod +x dist-release/sharkord-gpui-macos-arm64
            (cd dist-release && zip sharkord-gpui-macos-arm64.zip sharkord-gpui-macos-arm64)
          fi
          ls -la dist-release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sharkord Plus ${{ github.ref_name }}
          prerelease: true
          body_path: release-notes.md
          files: |
            dist-release/*
