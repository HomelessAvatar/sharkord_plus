name: Rust Core & GPUI Desktop CI

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
    paths:
      - 'crates/**'
      - 'apps/desktop-gpui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'crates/**'
      - 'apps/desktop-gpui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Test & Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev patchelf file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all Rust tests
        run: cargo test --all

      - name: Build release binaries
        run: cargo build --release -p desktop-gpui -p sharkord-core

      - name: Package desktop application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo packager --release -p desktop-gpui || cargo packager --release --config apps/desktop-gpui/packager.toml || (cd apps/desktop-gpui && cargo packager --release)
          mkdir -p target/packages-windows
          find . -type f \( -name "*.msi" -o -name "*.zip" \) ! -path "./target/debug/*" ! -path "./target/release/desktop-gpui.exe" ! -path "./target/packages-*/*" -exec cp {} target/packages-windows/ \; || true
          ls -la target/packages-windows

      - name: Package desktop application (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo packager --release -p desktop-gpui || cargo packager --release --config apps/desktop-gpui/packager.toml || (cd apps/desktop-gpui && cargo packager --release)
          mkdir -p target/packages-linux
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) ! -path "./target/debug/*" ! -path "./target/packages-*/*" -exec cp {} target/packages-linux/ \; || true
          ls -la target/packages-linux

      - name: Upload desktop artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-windows
          path: |
            target/release/desktop-gpui.exe
            target/packages-windows/*
          if-no-files-found: warn

      - name: Upload desktop artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-linux
          path: |
            target/release/desktop-gpui
            target/packages-linux/*
          if-no-files-found: warn

  build-macos:
    name: Build (macos-latest)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release binaries
        run: cargo build --release -p desktop-gpui -p sharkord-core

      - name: Package desktop application (macOS)
        run: |
          cargo packager --release -p desktop-gpui || cargo packager --release --config apps/desktop-gpui/packager.toml || (cd apps/desktop-gpui && cargo packager --release)
          mkdir -p target/packages-macos
          PACKAGES_DIR="$(pwd)/target/packages-macos"
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) ! -path "./target/debug/*" ! -path "./target/packages-*/*" -exec cp {} "$PACKAGES_DIR/" \; || true
          for app_path in $(find . -type d -name "*.app" ! -path "*/build/*" ! -path "*/target/debug/*"); do
            app_name=$(basename "$app_path" .app)
            if [ ! -f "$PACKAGES_DIR/${app_name}.zip" ]; then
              (cd "$(dirname "$app_path")" && zip -r "$PACKAGES_DIR/${app_name}-macos.zip" "$(basename "$app_path")")
            fi
          done
          ls -la "$PACKAGES_DIR"

      - name: Upload desktop artifacts (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-gpui-macos
          path: |
            target/release/desktop-gpui
            target/packages-macos/*
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    needs: [check-and-test, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate automated release notes
        run: node .github/scripts/generate-release-notes.js release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          if [ -f release-artifacts/sharkord-gpui-windows/desktop-gpui.exe ]; then
            cp release-artifacts/sharkord-gpui-windows/desktop-gpui.exe dist-release/sharkord-gpui-windows-x64.exe
            (cd dist-release && zip sharkord-gpui-windows-x64.zip sharkord-gpui-windows-x64.exe)
          fi
          if [ -f release-artifacts/sharkord-gpui-linux/desktop-gpui ]; then
            cp release-artifacts/sharkord-gpui-linux/desktop-gpui dist-release/sharkord-gpui-linux-x64
            chmod +x dist-release/sharkord-gpui-linux-x64
            (cd dist-release && tar -czvf sharkord-gpui-linux-x64.tar.gz sharkord-gpui-linux-x64)
          fi
          if [ -f release-artifacts/sharkord-gpui-macos/desktop-gpui ]; then
            cp release-artifacts/sharkord-gpui-macos/desktop-gpui dist-release/sharkord-gpui-macos-arm64
            chmod +x dist-release/sharkord-gpui-macos-arm64
            (cd dist-release && zip sharkord-gpui-macos-arm64.zip sharkord-gpui-macos-arm64)
          fi
          find release-artifacts -type f \( -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          find dist-release -type f \( -name "*.AppImage" -o -name "*-linux-*" -o -name "*-macos-*" \) -exec chmod +x {} \;
          ls -la dist-release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sharkord Plus ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: release-notes.md
          files: |
            dist-release/*
