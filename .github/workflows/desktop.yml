name: Desktop Tauri CI & Release

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
      - 'desktop-v*'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine build platforms
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/* || "${{ github.ref }}" == "refs/heads/main" ]]; then
            MATRIX='{"include":[{"platform":"windows-x64","os":"windows-latest","artifact_name":"sharkord-desktop-windows","experimental":false},{"platform":"linux-x86_64","os":"ubuntu-24.04","artifact_name":"sharkord-desktop-linux","experimental":false},{"platform":"macos-universal","os":"macos-15-intel","artifact_name":"sharkord-desktop-macos","experimental":true}]}'
          else
            MATRIX='{"include":[{"platform":"windows-x64","os":"windows-latest","artifact_name":"sharkord-desktop-windows","experimental":false},{"platform":"linux-x86_64","os":"ubuntu-24.04","artifact_name":"sharkord-desktop-linux","experimental":false}]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-tauri-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential file pkg-config libxkbcommon-dev libx11-dev libwayland-dev libxkbcommon-x11-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libgbm-dev libdrm-dev libfontconfig1-dev libfreetype-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libfuse2t64 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libfuse2 || true

      - name: Run Tauri unit tests
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml

      - name: Build frontend client
        run: bun --filter client build

      - name: Build Tauri desktop application
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-universal" ]; then
            bun --filter @sharkord/tauri build -- --target universal-apple-darwin || (sleep 5 && bun --filter @sharkord/tauri build -- --target universal-apple-darwin)
          else
            bun --filter @sharkord/tauri build || (sleep 5 && bun --filter @sharkord/tauri build)
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native GPUI Desktop Application
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" != "macos-universal" ]; then
            cargo test -p desktop-gpui
          fi
          if [ "${{ matrix.platform }}" = "macos-universal" ]; then
            cargo build --release -p desktop-gpui --target aarch64-apple-darwin && \
            cargo build --release -p desktop-gpui --target x86_64-apple-darwin && \
            mkdir -p target/release && \
            lipo -create -output target/release/desktop-gpui \
              target/aarch64-apple-darwin/release/desktop-gpui \
              target/x86_64-apple-darwin/release/desktop-gpui || \
            cargo build --release -p desktop-gpui
          else
            cargo build --release -p desktop-gpui
          fi

      - name: Stage desktop artifacts
        shell: bash
        run: |
          mkdir -p dist-desktop
          find target/release/bundle target/universal-apple-darwin/release/bundle apps/tauri/src-tauri/target/release/bundle target/release apps/tauri/src-tauri/target/release -maxdepth 4 -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) -exec cp {} dist-desktop/ \; 2>/dev/null || true
          rm -f dist-desktop/desktop-gpui.exe
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION=$(bun -e "console.log(require('./package.json').version)" 2>/dev/null || echo "0.3.21")
          fi
          [ -z "$VERSION" ] && VERSION="0.3.21"
          if [ -f dist-desktop/sharkord-tauri.exe ]; then
            mv dist-desktop/sharkord-tauri.exe "dist-desktop/VibeShark_${VERSION}_x64-portable.exe"
          fi
          if [ -f target/release/desktop-gpui.exe ]; then
            cp target/release/desktop-gpui.exe "dist-desktop/VibeShark-Native-GPUI_${VERSION}_windows-x64.exe"
          fi
          if [ -f target/release/desktop-gpui ]; then
            cp target/release/desktop-gpui "dist-desktop/VibeShark-Native-GPUI_${VERSION}_${{ matrix.platform }}"
          fi
          echo "=== Staged Desktop Artifacts ==="
          ls -la dist-desktop || true

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-desktop/*
          if-no-files-found: warn

  publish-release:
    name: Publish Desktop Release
    if: "!cancelled() && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v'))"
    needs: [build-tauri-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all desktop build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-artifacts dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*GPUI*" \) -exec cp {} dist-release/ \; 2>/dev/null || true
          echo "=== Contents of dist-release ==="
          ls -la dist-release
          if [ -z "$(ls -A dist-release 2>/dev/null)" ]; then
            echo "Error: No desktop artifacts found to publish."
            exit 1
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_release_notes.py "${{ github.ref_name }}" release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VibeShark ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          append_body: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist-release/*
