name: Desktop Tauri CI & Release

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
      - 'desktop-v*'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact_name: sharkord-desktop-windows
            experimental: false
          - platform: linux-x86_64
            os: ubuntu-24.04
            artifact_name: sharkord-desktop-linux
            experimental: false
          - platform: macos-universal
            os: macos-latest
            artifact_name: sharkord-desktop-macos
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential file libxkbcommon-dev libx11-dev libwayland-dev libxkbcommon-x11-dev
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libfuse2t64 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libfuse2 || true

      - name: Run Tauri unit tests
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml

      - name: Build frontend client
        run: bun --filter client build

      - name: Build Tauri desktop application
        shell: bash
        run: bun --filter @sharkord/tauri build || (sleep 5 && bun --filter @sharkord/tauri build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native GPUI Desktop Application
        shell: bash
        run: |
          cargo build --release -p desktop-gpui || echo "Warning: GPUI build failed for ${{ matrix.platform }}"

      - name: Stage desktop artifacts
        shell: bash
        run: |
          mkdir -p dist-desktop
          find target/release/bundle apps/tauri/src-tauri/target/release/bundle target/release apps/tauri/src-tauri/target/release -maxdepth 4 -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) -exec cp {} dist-desktop/ \; 2>/dev/null || true
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.3.21"
          if [ -f dist-desktop/sharkord-tauri.exe ]; then
            mv dist-desktop/sharkord-tauri.exe "dist-desktop/VibeShark_${VERSION}_x64-portable.exe"
          fi
          if [ -f target/release/desktop-gpui.exe ]; then
            cp target/release/desktop-gpui.exe "dist-desktop/VibeShark-Native-GPUI_${VERSION}_windows-x64.exe"
          fi
          if [ -f target/release/desktop-gpui ]; then
            cp target/release/desktop-gpui "dist-desktop/VibeShark-Native-GPUI_${VERSION}_${{ matrix.platform }}"
          fi
          echo "=== Staged Desktop Artifacts ==="
          ls -la dist-desktop || true

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-desktop/*
          if-no-files-found: warn

  publish-release:
    name: Publish Desktop Release
    if: "always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v'))"
    needs: [build-tauri-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all desktop build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*GPUI*" \) -exec cp {} dist-release/ \;
          echo "=== Contents of dist-release ==="
          ls -la dist-release

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_release_notes.py "${{ github.ref_name }}" release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VibeShark ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          append_body: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist-release/*
