name: Desktop Tauri CI & Release

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'desktop-v*'
      - 'v*'
    paths:
      - 'crates/**'
      - 'apps/tauri/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'crates/**'
      - 'apps/tauri/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-desktop:
    name: Build Desktop (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            args: ''
          - platform: ubuntu-24.04
            name: linux-x64
            args: ''
          - platform: macos-latest
            name: macos-arm64
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/tauri/src-tauri -> target'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Run Tauri unit tests
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml

      - name: Build Tauri desktop application (tauri build)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Sharkord Plus Desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease:
            ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name,
            'beta') || contains(github.ref_name, 'rc') }}
          includeRelease: false
          args: ${{ matrix.args }}

      - name: Stage desktop artifacts
        shell: bash
        run: |
          mkdir -p dist-desktop
          find target/release/bundle apps/tauri/src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist-desktop/ \; 2>/dev/null || true
          ls -la dist-desktop || true

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-desktop-${{ matrix.name }}
          path: dist-desktop/*
          if-no-files-found: warn

  publish-release:
    name: Publish Desktop Release
    if:
      startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref,
      'refs/tags/v')
    needs: [build-tauri-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate automated release notes
        run:
          node .github/scripts/generate-release-notes.js release-notes.md ||
          echo "Release ${{ github.ref_name }}" > release-notes.md

      - name: Download desktop build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist-release/ \;
          find dist-release -type f \( -name "*.AppImage" -o -name "*-linux-*" -o -name "*-macos-*" \) -exec chmod +x {} \; 2>/dev/null || true
          echo "=== Contents of dist-release ==="
          ls -la dist-release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sharkord Plus Desktop ${{ github.ref_name }}
          append_body: true
          prerelease:
            ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name,
            'beta') || contains(github.ref_name, 'rc') }}
          body_path: release-notes.md
          files: |
            dist-release/*
