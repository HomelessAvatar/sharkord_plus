name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'apps/server/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker.yml'
    tags:
      - 'server-v*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Multi-Arch Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Bun and build server artifacts
        uses: ./.github/actions/build-sharkord

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Docker Hub credentials
        id: dockerhub_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub (Optional)
        if: steps.dockerhub_check.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.REPO_LC }}
            ${{ steps.dockerhub_check.outputs.enabled == 'true' && format('{0}/sharkord_plus', secrets.DOCKER_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=match,pattern=server-v(.*),group=1
            type=match,pattern=v(.*),group=1
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/server-v') || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Sharkord Plus
            org.opencontainers.image.description=Sharkord Plus Self-Hosted Server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            wud.watch=true
            wud.tag.include=^\d+\.\d+\.\d+.*$
            wud.link.template=https://github.com/${{ github.repository }}/releases/tag/v$${major}.$${minor}.$${patch}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
