name: Mobile Tauri Android CI & Release

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
      - 'mobile-v*'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile-tauri:
    name: Build Mobile (Tauri Android APK)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.2.12479018" || sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973" || sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;26.1.10909125"
          # Remove untested experimental/preview NDK versions (such as NDK 30) pre-installed on the runner image
          rm -rf "$ANDROID_HOME/ndk/30*" || true
          rm -rf "$ANDROID_HOME/ndk/28*" || true
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -name "27.*" -type d | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -name "26.*" -type d | sort -V | tail -n 1)
          fi
          echo "Selected NDK at: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/tauri/src-tauri -> target'

      - name: Run Tauri mobile and Android tests
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --test android_manifest_test

      - name: Build frontend client
        run: bun --filter client build

      - name: Prepare Android release signing keystore
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          REPO_KEYSTORE="$GITHUB_WORKSPACE/apps/tauri/src-tauri/gen/android/release.keystore"
          if [ -n "$ANDROID_SIGNING_KEY_BASE64" ]; then
            echo "Using custom secret ANDROID_SIGNING_KEY_BASE64..."
            KEYSTORE_PATH="$HOME/release.keystore"
            echo "$ANDROID_SIGNING_KEY_BASE64" | base64 -d > "$KEYSTORE_PATH"
          elif [ -f "$REPO_KEYSTORE" ]; then
            echo "Using persistent repository release keystore..."
            KEYSTORE_PATH="$REPO_KEYSTORE"
          else
            echo "Generating fallback keystore..."
            KEYSTORE_PATH="$HOME/release.keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias sharkord \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass sharkord \
              -keypass sharkord \
              -dname "CN=VibeShark, OU=VibeShark, O=VibeShark, C=US"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=sharkord" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=sharkord" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=sharkord" >> $GITHUB_ENV

      - name: Pre-bundle NDK libc++_shared into jniLibs
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/$abi
          done
          # Copy exact arch-specific libc++_shared.so from NDK sysroot
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          if [ -d "$SYSROOT" ]; then
            cp -v "$SYSROOT/aarch64-linux-android/libc++_shared.so" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/ || true
            cp -v "$SYSROOT/arm-linux-androideabi/libc++_shared.so" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a/ || true
            cp -v "$SYSROOT/i686-linux-android/libc++_shared.so" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/x86/ || true
            cp -v "$SYSROOT/x86_64-linux-android/libc++_shared.so" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/x86_64/ || true
          else
            find "$NDK_HOME" -name "libc++_shared.so" | while read -r lib; do
              if [[ "$lib" == *"aarch64-linux-android"* ]]; then
                cp -v "$lib" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
              elif [[ "$lib" == *"arm-linux-androideabi"* ]]; then
                cp -v "$lib" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a/
              elif [[ "$lib" == *"i686-linux-android"* ]]; then
                cp -v "$lib" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/x86/
              elif [[ "$lib" == *"x86_64-linux-android"* ]]; then
                cp -v "$lib" apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/x86_64/
              fi
            done
          fi
          ls -la apps/tauri/src-tauri/gen/android/app/src/main/jniLibs/* || true

      - name: Build Tauri Android APK (tauri android build)
        run: bun --filter @sharkord/tauri android:build
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ env.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}

      - name: Stage and sign mobile artifacts
        run: |
          mkdir -p dist-mobile-tauri
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.3.4"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          find apps/tauri/src-tauri/gen/android/app/build/outputs target -type f -name "*.apk" | while read -r apk; do
            echo "Processing APK: $apk"
            DEST="dist-mobile-tauri/VibeShark_${VERSION}.apk"

            if [ -n "$APKSIGNER" ] && "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
              echo "APK is already signed."
              cp "$apk" "$DEST"
            else
              echo "Signing APK with apksigner..."
              if [ -n "$ZIPALIGN" ]; then
                "$ZIPALIGN" -f -P 16 4 "$apk" "$DEST" || "$ZIPALIGN" -f 4 "$apk" "$DEST" || cp "$apk" "$DEST"
              else
                cp "$apk" "$DEST"
              fi
              if [ -n "$APKSIGNER" ]; then
                "$APKSIGNER" sign \
                  --ks "$ANDROID_KEYSTORE_PATH" \
                  --ks-pass pass:sharkord \
                  --ks-key-alias sharkord \
                  --key-pass pass:sharkord \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  "$DEST"
              fi
            fi

            if [ -n "$APKSIGNER" ]; then
              echo "Verifying final APK signature:"
              "$APKSIGNER" verify --verbose "$DEST"
            fi
            echo "Checking native libraries inside APK:"
            unzip -l "$DEST" | grep "\.so" || true
            # Also keep backwards-compatible Sharkord.Plus asset name
            cp "$DEST" "dist-mobile-tauri/Sharkord.Plus_${VERSION}.apk"
          done

          find apps/tauri/src-tauri/gen/android/app/build/outputs target -type f -name "*.aab" | while read -r aab; do
            cp "$aab" "dist-mobile-tauri/VibeShark_${VERSION}.aab"
            cp "$aab" "dist-mobile-tauri/Sharkord.Plus_${VERSION}.aab"
          done

          echo "=== Staged Mobile Artifacts ==="
          ls -la dist-mobile-tauri || true

      - name: Upload mobile build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sharkord-tauri-android
          path: dist-mobile-tauri/*
          if-no-files-found: warn

  publish-mobile-release:
    name: Publish Mobile Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [build-mobile-tauri]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          name: sharkord-tauri-android
          path: dist-release

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/generate_release_notes.py "${{ github.ref_name }}" release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VibeShark ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          append_body: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist-release/*
