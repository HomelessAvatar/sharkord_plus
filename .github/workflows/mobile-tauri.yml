name: Mobile Tauri Android CI & Release

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
      - 'mobile-v*'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile-tauri:
    name: Build Mobile (Tauri Android APK)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/tauri/src-tauri -> target'

      - name: Run Tauri mobile and Android tests
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --test android_manifest_test

      - name: Build frontend client
        run: bun --filter client build

      - name: Build Tauri Android APK (tauri android build)
        run: bun --filter @sharkord/tauri android:build
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Stage mobile artifacts
        run: |
          mkdir -p dist-mobile-tauri
          find apps/tauri/src-tauri/gen/android/app/build/outputs target -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist-mobile-tauri/ \; 2>/dev/null || true
          echo "=== Staged Mobile Artifacts ==="
          ls -la dist-mobile-tauri || true

      - name: Upload mobile build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sharkord-tauri-android
          path: dist-mobile-tauri/*
          if-no-files-found: warn

  publish-mobile-release:
    name: Publish Mobile Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [build-mobile-tauri]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          name: sharkord-tauri-android
          path: dist-release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sharkord Plus ${{ github.ref_name }}
          append_body: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist-release/*
