name: Mobile CI & Release

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'mobile-v*'
      - 'v*'
    paths:
      - 'apps/mobile/**'
      - 'crates/sharkord-mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'apps/mobile/**'
      - 'crates/sharkord-mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile-android:
    name: Build Mobile (Android APK)
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Run Flutter tests
        run: |
          cd apps/mobile
          flutter pub get
          flutter test

      - name: Build release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Stage mobile artifacts
        run: |
          mkdir -p dist-mobile
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk dist-mobile/sharkord-mobile-android.apk
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist-mobile/sharkord-mobile-android-${{ github.ref_name }}.apk"
          fi
          ls -la dist-mobile

      - name: Upload mobile artifacts (Android)
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-mobile-android
          path: dist-mobile/*
          if-no-files-found: warn

  build-mobile-ios:
    name: Build Mobile (iOS Sideload IPA)
    if: startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Build iOS unsigned bundle
        run: |
          cd apps/mobile
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package Sideloadable IPA
        run: |
          mkdir -p dist-ios/Payload
          cp -r apps/mobile/build/ios/iphoneos/Runner.app dist-ios/Payload/
          (cd dist-ios && zip -r sharkord-mobile-ios-unsigned.ipa Payload)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp dist-ios/sharkord-mobile-ios-unsigned.ipa "dist-ios/sharkord-mobile-ios-${{ github.ref_name }}-unsigned.ipa"
          fi
          ls -la dist-ios

      - name: Upload mobile artifacts (iOS)
        uses: actions/upload-artifact@v7
        with:
          name: sharkord-mobile-ios
          path: dist-ios/*
          if-no-files-found: warn

  publish-release:
    name: Publish Mobile Release
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/mobile-v') || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-mobile-android, build-mobile-ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate automated release notes
        run: node .github/scripts/generate-release-notes.js release-notes.md

      - name: Download mobile build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.apk" -o -name "*.ipa" \) -exec cp {} dist-release/ \;
          echo "=== Contents of dist-release ==="
          ls -la dist-release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sharkord Plus Mobile ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: release-notes.md
          files: |
            dist-release/*
