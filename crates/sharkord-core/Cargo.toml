[package]
name = "sharkord-core"
version = "0.1.1"
edition = "2021"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
wiremock = "0.6"

